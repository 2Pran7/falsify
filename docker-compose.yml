services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: falsify-db
    environment:
      POSTGRES_USER: falsify
      POSTGRES_PASSWORD: falsify_dev   # local dev only — never in prod
      POSTGRES_DB: falsify
    ports:
      - "5432:5432"
    volumes:
      - af_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falsify"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  af_pgdata:
